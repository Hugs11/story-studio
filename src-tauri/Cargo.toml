[package]
name = "story-studio"
version = "0.9.11"
description = "Cross-platform desktop editor for creating Lunii-compatible story packs"
authors = ["hugs11"]
license = "MIT"
homepage = "https://hugs11.github.io/story-studio/"
repository = "https://github.com/Hugs11/story-studio"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "story_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "=0.22.1"
aes = "=0.8.4"
junkyard = { version = "=0.1.0", default-features = false }
tauri = { version = "2", features = [] }
# Already supplied by Tauri; async admission and coalescing for audio analysis.
tokio = { version = "=1.51.0", features = ["sync", "rt"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` : sans elle, `parse_decimal` convertit le significand en `f64` puis
# divise par une puissance de dix ; ce double arrondi décale de 1 ULP les mantisses
# longues du dialecte STUdio v1.
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth", "raw_value"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
log = "0.4"
zip = "2"
sha1 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
notify-debouncer-full = "0.7.0"
rayon = "1"
roxmltree = "0.20"
unicode-normalization = "0.1"

dom_query = { version = "=0.27.0", default-features = false }
# Same version as dom_query: drives its TreeSink under a counting wrapper.
html5ever = "=0.38.0"

[target.'cfg(unix)'.dependencies]
# Exact allocation unit and read-only mount flag, shared POSIX adapter.
libc = "=0.2.184"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gtk = "0.18"
webkit2gtk = "2.0.2"

[dev-dependencies]
# WebView factice seulement : les tests exercent le handler IPC et le codec réels.
tauri = { version = "2", features = ["test"] }

# Dépendances optimisées même en développement : compression, hachage et
# décodage d'images sont 3 à 4 fois plus lents sans optimisation, ce qui fausse
# les temps d'envoi vus dans `tauri dev`. Le code du crate reste en debug.
[profile.dev.package."*"]
opt-level = 2
