name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundles:
    name: ${{ matrix.name }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            cache: windows-x64
            bundles: nsis,msi
            artifact: story-studio-windows-x64
            artifactPath: |
              src-tauri/target/release/bundle/nsis/**/*
              src-tauri/target/release/bundle/msi/**/*
          - name: Linux x86_64
            os: ubuntu-22.04
            cache: linux-x86_64
            bundles: appimage,deb,rpm
            artifact: story-studio-linux-x86_64
            artifactPath: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - name: macOS ARM64
            os: macos-15
            cache: macos-arm64
            bundles: app,dmg
            artifact: story-studio-macos-arm64
            artifactPath: |
              src-tauri/target/release/bundle/macos/**/*
              src-tauri/target/release/bundle/dmg/**/*

    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            gstreamer1.0-libav \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            python3-venv \
            rpm \
            unzip \
            xdg-utils \
            xz-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.cache }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.cache }}-cargo-release-
            ${{ matrix.cache }}-cargo-

      - name: Cache verified build downloads
        uses: actions/cache@v4
        with:
          path: src-tauri/tools/.download-cache
          key: ${{ matrix.cache }}-downloads-${{ hashFiles('scripts/verified-download.mjs', 'scripts/prepare-platform-tools.mjs', 'scripts/build-piper-runtime.mjs', 'scripts/piper-runtime-manifest.mjs', 'scripts/patch-linux-appimage.mjs') }}
          restore-keys: |
            ${{ matrix.cache }}-downloads-

      - name: Install dependencies
        run: npm ci

      - name: Install modern CMake and Ninja on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/piper-build-tools"
          "${RUNNER_TEMP}/piper-build-tools/bin/pip" install \
            --disable-pip-version-check \
            cmake==3.31.10 \
            ninja==1.13.0
          echo "${RUNNER_TEMP}/piper-build-tools/bin" >> "${GITHUB_PATH}"

      - name: Prepare native platform tools
        run: node scripts/prepare-platform-tools.mjs

      - name: Build and validate Piper runtime
        run: npm run build:piper-runtime

      - name: Check version consistency
        run: npm run check:version

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const v=require("./package.json").version;if(`v${v}`!==process.env.RELEASE_TAG)throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${v}.`)'

      - name: Build Tauri bundles
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Remove host-incompatible libraries from AppImage
        if: runner.os == 'Linux'
        run: node scripts/patch-linux-appimage.mjs src-tauri/target/release/bundle/appimage

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
