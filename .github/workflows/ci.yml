name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            cache: windows-x64
          - name: Linux x86_64
            os: ubuntu-22.04
            cache: linux-x86_64
          - name: macOS ARM64
            os: macos-15
            cache: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            python3-venv \
            unzip \
            xz-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.cache }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.cache }}-cargo-

      - name: Cache verified build downloads
        uses: actions/cache@v4
        with:
          path: src-tauri/tools/.download-cache
          key: ${{ matrix.cache }}-downloads-${{ hashFiles('scripts/verified-download.mjs', 'scripts/prepare-platform-tools.mjs', 'scripts/build-piper-runtime.mjs', 'scripts/piper-runtime-manifest.mjs', 'scripts/patch-linux-appimage.mjs') }}
          restore-keys: |
            ${{ matrix.cache }}-downloads-

      - name: Install dependencies
        run: npm ci

      - name: Prepare native platform tools
        run: node scripts/prepare-platform-tools.mjs

      - name: Install modern CMake and Ninja on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/piper-build-tools"
          "${RUNNER_TEMP}/piper-build-tools/bin/pip" install \
            --disable-pip-version-check \
            cmake==3.31.10 \
            ninja==1.13.0
          echo "${RUNNER_TEMP}/piper-build-tools/bin" >> "${GITHUB_PATH}"

      - name: Build and validate Piper runtime
        run: npm run build:piper-runtime

      - name: Check version consistency
        run: npm run check:version

      - name: Lint frontend and scripts
        run: npm run lint

      - name: JavaScript tests
        run: node --test scripts/*.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
